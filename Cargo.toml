[package]
name = "ptop"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "A system monitor you can rewind"
readme = "README.md"

[dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"

[target.'cfg(target_os = "macos")'.dependencies]
sysinfo = "0.38.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
